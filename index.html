<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حاسبة عروض ليدي طبطب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf3ef;
  --surface:#fff;
  --surface-alt:#fff9f4;
  --border:#eadfd9;
  --text:#3a2530;
  --muted:#8c7481;
  --primary:#b85c7a;
  --primary-dark:#93415c;
  --primary-light:#d98ba6;
  --primary-tint:#fceef3;
  --success:#6e8060;
  --success-bg:#e3eadb;
  --success-tint:#f0f5ea;
  --warning-bg:#f3e7d2;
  --warning-border:#e4cfa0;
  --shadow-sm:0 1px 3px rgba(58,37,48,.06);
  --shadow-md:0 4px 16px rgba(58,37,48,.08);
  --shadow-lg:0 8px 32px rgba(58,37,48,.12);
  --radius:16px;
  --radius-sm:10px;
  --radius-xs:9px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Cairo",Arial,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:18px 12px 100px;min-height:100vh}
main{max-width:700px;margin:auto}

/* Header */
header{
  background:linear-gradient(135deg,var(--surface-alt),var(--primary-tint));
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:22px 20px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
  position:relative;
  overflow:hidden;
}
header::before{
  content:"";
  position:absolute;
  top:-30px;left:-30px;
  width:120px;height:120px;
  background:radial-gradient(circle,rgba(184,92,122,.08),transparent 70%);
  border-radius:50%;
}
.header-tag{color:var(--primary-dark);font-weight:700;font-size:13px;letter-spacing:.3px}
h1{font-size:24px;margin:6px 0 4px;font-weight:800}
header .sub{font-size:14px;color:var(--muted);line-height:1.6}

/* Cards */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .2s ease;
}
.card:hover{box-shadow:var(--shadow-md)}
.title{font-weight:700;margin-bottom:12px;font-size:15px;display:flex;align-items:center;gap:8px}
.title .step{
  display:inline-flex;
  align-items:center;justify-content:center;
  width:26px;height:26px;
  background:var(--primary);color:#fff;
  border-radius:50%;font-size:13px;font-weight:700;
  flex-shrink:0;
}

/* Search */
input{
  width:100%;height:46px;
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:0 14px;font-size:15px;
  font-family:inherit;
  margin-bottom:12px;
  background:var(--bg);
  transition:border-color .2s,box-shadow .2s,background .2s;
}
input:focus{
  outline:none;
  border-color:var(--primary-light);
  box-shadow:0 0 0 3px rgba(184,92,122,.12);
  background:var(--surface);
}

/* Tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{height:3px}
.tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tabs button{
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:var(--radius-xs);
  padding:8px 14px;
  font-size:14px;
  font-family:inherit;
  font-weight:600;
  color:var(--text);
  cursor:pointer;
  white-space:nowrap;
  transition:all .2s ease;
}
.tabs button:hover{border-color:var(--primary-light);color:var(--primary)}
.tabs button.active{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
  box-shadow:0 2px 8px rgba(184,92,122,.25);
}

/* Products */
.products{max-height:380px;overflow-y:auto;border-top:1px solid var(--border);margin-top:2px}
.products::-webkit-scrollbar{width:4px}
.products::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.product{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 4px;
  border-bottom:1px solid var(--border);
  gap:10px;
  transition:background .15s ease;
  animation:fadeIn .25s ease;
}
.product:hover{background:var(--surface-alt)}
.product:last-child{border-bottom:none}
.name{font-weight:700;font-size:14px;line-height:1.4}
.price{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.qty{display:flex;align-items:center;gap:6px;flex-shrink:0}
.qty button{
  width:34px;height:34px;padding:0;
  font-size:20px;font-weight:700;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:var(--radius-xs);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;
  color:var(--text);
  font-family:inherit;
}
.qty button:hover{background:var(--primary);color:#fff;border-color:var(--primary);transform:scale(1.08)}
.qty button:active{transform:scale(.95)}
.qty b{
  min-width:22px;text-align:center;
  font-size:15px;font-weight:700;
  transition:transform .15s ease;
}
.qty b.bump{animation:bump .3s ease}

/* Cart */
.cartrow{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px dashed var(--border);
  padding:8px 0;font-size:14px;
  animation:fadeIn .25s ease;
}
.cartrow b{font-weight:700}
.cartrow span{color:var(--muted);font-weight:600}
.total{font-weight:800;padding-top:12px;font-size:15px}
.empty{color:var(--muted);text-align:center;padding:24px 16px;font-size:14px}

/* Offer cards */
.offer{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow-sm);
  position:relative;
  transition:all .3s ease;
  animation:slideUp .35s ease;
}
.offer:hover{box-shadow:var(--shadow-md)}
.offer.best{
  background:linear-gradient(135deg,var(--success-bg),var(--success-tint));
  border-color:var(--success);
  box-shadow:0 4px 20px rgba(110,128,96,.15);
}
.offer.best:hover{box-shadow:0 8px 28px rgba(110,128,96,.2)}
.badge{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--success);color:#fff;
  border-radius:20px;padding:5px 12px;
  font-size:12px;font-weight:700;
  margin-bottom:10px;
  animation:badgePop .4s ease;
}
.offer h3{margin:0 0 5px;font-size:16px;font-weight:800}
.offer .sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px}
.offer-price{font-size:26px;font-weight:800;letter-spacing:-.5px}
.offer.best .offer-price{color:var(--success)}
.save{color:var(--success);font-weight:700;margin-top:6px;font-size:14px}

/* Savings bar */
.savings-bar{
  height:6px;border-radius:3px;
  background:var(--border);
  margin-top:10px;overflow:hidden;
}
.savings-bar .fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--success),#8ba87a);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}
.offer:not(.best) .savings-bar .fill{
  background:linear-gradient(90deg,var(--primary-light),var(--primary));
}

/* Verdict */
.verdict{
  background:var(--warning-bg);
  border:1px solid var(--warning-border);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  line-height:1.8;
  font-size:14px;
  font-weight:600;
  box-shadow:var(--shadow-sm);
  animation:slideUp .35s ease;
}
.verdict b{font-weight:800}

/* Reset */
.reset{
  width:100%;height:48px;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:var(--radius-sm);
  font-size:15px;font-weight:700;
  font-family:inherit;
  color:var(--text);
  cursor:pointer;
  transition:all .2s ease;
}
.reset:hover{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 14px rgba(184,92,122,.2)}
.reset:active{transform:scale(.98)}

small{color:var(--muted);display:block;margin-top:10px;line-height:1.7;font-size:12px}

/* Sticky cart bar — mobile only */
.cart-bar{
  display:none;
  position:fixed;
  bottom:0;left:0;right:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  box-shadow:0 -4px 20px rgba(58,37,48,.1);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  z-index:100;
  transform:translateY(100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
  width:100%;
}
.cart-bar.visible{transform:translateY(0)}
.cart-bar-inner{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cart-bar-info{display:flex;flex-direction:column;gap:1px}
.cart-bar-count{font-size:12px;color:var(--muted);font-weight:600}
.cart-bar-total{font-size:17px;font-weight:800}
.cart-bar-btn{
  background:var(--primary);color:#fff;
  border:none;border-radius:var(--radius-sm);
  padding:12px 18px;
  font-size:14px;font-weight:700;
  font-family:inherit;
  cursor:pointer;
  transition:all .2s ease;
  white-space:nowrap;
  min-height:44px;
  display:flex;align-items:center;
}
.cart-bar-btn:active{background:var(--primary-dark);transform:scale(.96)}

/* Animations */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes badgePop{0%{transform:scale(0)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

@media(max-width:600px){
  body{padding:14px 10px 90px}
  header{padding:18px 16px}
  h1{font-size:21px}
  .card{padding:14px}
  .offer-price{font-size:22px}
  .cart-bar{display:block}
  .qty button{width:38px;height:38px}
  .qty{gap:8px}
  .tabs button{padding:10px 14px;font-size:15px}
  input{height:48px;font-size:16px}
  .reset{height:50px}
}
</style>
</head>
<body>
<main>
<header>
<div class="header-tag">للعيد الثامن — العروض الحالية</div>
<h1>حاسبة عروض ليدي طبطب</h1>
<p class="sub">اختاري المنتجات والحاسبة هتقارن لك بين العرضين.</p>
</header>

<section class="card">
<div class="title"><span class="step">١</span> هتحسبي إزاي؟</div>
<div id="modeTabs" class="tabs"></div>
<div id="peopleControls" style="display:none;margin-top:10px">
  <div id="peopleCountTabs" class="tabs"></div>
  <div id="personTabs" class="tabs"></div>
</div>
</section>

<section class="card">
<div class="title"><span class="step">٢</span> اختاري المنتجات</div>
<input id="search" type="search" placeholder="دوري على منتج...">
<div id="tabs" class="tabs"></div>
<div id="products" class="products"></div>
</section>

<section class="card">
<div class="title"><span class="step">٣</span> سلة الاختيار</div>
<div id="cart"><div class="empty">لسه ماحطيتيش منتجات</div></div>
</section>

<section id="results"></section>
<button id="reset" class="reset">مسح الاختيار كله</button>
</main>

<div id="cartBar" class="cart-bar">
<div class="cart-bar-inner">
<div class="cart-bar-info">
<span class="cart-bar-count" id="cartBarCount"></span>
<span class="cart-bar-total" id="cartBarTotal"></span>
</div>
<button class="cart-bar-btn" id="cartBarBtn">قارن العروض</button>
</div>
</div>

].map(function(p,i) {
  return {id:i,en:p[0],ar:p[1],price:Number(p[2])};
});

var CATS = [
  ["all","الكل"],
  ["face","بشرة"],
  ["hair","شعر"],
  ["body","جسم"],
  ["fragrance","عطور"]
];

var activeCat="all";
var search="";
var cart={};

var mode="single"; // "single" | "split"
var numPeople=2;
var currentPerson=0;
var personCarts=[{},{},{}];
var PERSON_LABELS=["الشخص ١","الشخص ٢","الشخص ٣"];

function activeCart(){
  return mode==="single" ? cart : personCarts[currentPerson];
}

function money(n) {
  return Math.round(n).toLocaleString("en-US")+" ج.م";
}

function matchesCategory(p,key) {
  if(key==="all") return true;
  var s=p.ar+" "+p.en;
  if(key==="face") return /سيروم|غسول|كريم|سنتيلا|ويللو|بلامب|ميست الوجه|هيالورونيك|بوبا|صن فريند/i.test(s);
  if(key==="hair") return /شعر|شامبو|هير|فايبرهانس|تساقط|جوچو|چوچو/i.test(s);
  if(key==="body") return /جسم|بادي|صابون|باديكير|جليز|بوتي|زبدة|ليفة/i.test(s);
  if(key==="fragrance") return /برفيوم|عرق|سبلاش|ميست|مخمرية/i.test(s);
  return true;
}

function renderModeTabs(){
  var box=document.getElementById("modeTabs");
  box.innerHTML="";
  [["single","لوحدك"],["split","قسمة بين أصحاب"]].forEach(function(m){
    var b=document.createElement("button");
    b.textContent=m[1];
    if(mode===m[0]) b.className="active";
    b.onclick=function(){
      mode=m[0];
      currentPerson=0;
      renderModeTabs();
      renderPeopleControls();
      renderAll();
    };
    box.appendChild(b);
  });
}

function renderPeopleControls(){
  var wrap=document.getElementById("peopleControls");
  var countBox=document.getElementById("peopleCountTabs");
  var personBox=document.getElementById("personTabs");
  if(mode!=="split"){ wrap.style.display="none"; return; }
  wrap.style.display="block";

  countBox.innerHTML="";
  [2,3].forEach(function(n){
    var b=document.createElement("button");
    b.textContent=n+" أشخاص";
    if(numPeople===n) b.className="active";
    b.onclick=function(){
      numPeople=n;
      if(currentPerson>=numPeople) currentPerson=0;
      if(n===2) personCarts[2]={};
      renderPeopleControls();
      renderAll();
    };
    countBox.appendChild(b);
  });

  personBox.innerHTML="";
  for(var i=0;i<numPeople;i++){
    (function(i){
      var b=document.createElement("button");
      var c=personCarts[i];
      var q=Object.keys(c).reduce(function(s,id){return s+c[id];},0);
      var t=Object.keys(c).reduce(function(s,id){return s+PRODUCTS[Number(id)].price*c[id];},0);
      b.innerHTML=PERSON_LABELS[i]+(q?" · "+q+" · "+money(t):"");
      if(currentPerson===i) b.className="active";
      b.onclick=function(){
        currentPerson=i;
        renderPeopleControls();
        renderProducts();
        renderCart();
        renderCartBar();
      };
      personBox.appendChild(b);
    })(i);
  }
}

function renderAll(){
  renderProducts();
  renderCart();
  renderResults();
  renderCartBar();
}

function renderTabs() {
  var box=document.getElementById("tabs");
  box.innerHTML="";
  CATS.forEach(function(c) {
    var b=document.createElement("button");
    b.textContent=c[1];
    if(c[0]===activeCat) b.className="active";
    b.onclick=function(){activeCat=c[0];renderTabs();renderProducts();};
    box.appendChild(b);
  });
}

function renderProducts() {
  var box=document.getElementById("products");
  box.innerHTML="";
  var term=search.toLowerCase();
  var found=0;

  PRODUCTS.forEach(function(p) {
    if(!matchesCategory(p,activeCat)) return;
    if(term && p.ar.indexOf(search)===-1 && p.en.toLowerCase().indexOf(term)===-1) return;

    found++;
    var row=document.createElement("div");
    row.className="product";

    var info=document.createElement("div");
    var name=document.createElement("div");
    name.className="name";
    name.textContent=p.ar;
    var price=document.createElement("div");
    price.className="price";
    price.textContent=money(p.price);
    info.appendChild(name);
    info.appendChild(price);

    var qty=document.createElement("div");
    qty.className="qty";

    var minus=document.createElement("button");
    minus.textContent="−";
    minus.onclick=function(){changeQty(p.id,-1);};

    var num=document.createElement("b");
    num.id="q-"+p.id;
    num.textContent=activeCart()[p.id]||0;

    var plus=document.createElement("button");
    plus.textContent="+";
    plus.onclick=function(){changeQty(p.id,1);};

    qty.appendChild(minus); qty.appendChild(num); qty.appendChild(plus);
    row.appendChild(info); row.appendChild(qty);
    box.appendChild(row);
  });

  if(!found) box.innerHTML='<div class="empty">مفيش منتجات مطابقة</div>';
}

function changeQty(id,delta) {
  var c=activeCart();
  var next=(c[id]||0)+delta;
  if(next<=0) delete c[id];
  else c[id]=next;
  renderProducts();
  renderCart();
  renderResults();
  renderCartBar();
  if(mode==="split") renderPeopleControls();
  bumpQty(id);
}

function bumpQty(id) {
  var el=document.getElementById("q-"+id);
  if(!el) return;
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}

function renderCart() {
  var box=document.getElementById("cart");

  if(mode==="split"){
    var any=false;
    box.innerHTML="";
    for(var p=0;p<numPeople;p++){
      var c=personCarts[p];
      var ids=Object.keys(c);
      if(!ids.length) continue;
      any=true;
      var head=document.createElement("div");
      head.style.fontWeight="800";
      head.style.marginTop="8px";
      head.style.fontSize="13.5px";
      head.style.color="var(--primary-dark)";
      head.textContent=PERSON_LABELS[p];
      box.appendChild(head);
      var pt=0;
      ids.forEach(function(id){
        var prod=PRODUCTS[Number(id)], q=c[id];
        pt+=prod.price*q;
        var row=document.createElement("div");
        row.className="cartrow";
        row.innerHTML="<b>"+prod.ar+"</b><span>"+q+" × "+money(prod.price)+"</span>";
        box.appendChild(row);
      });
      var sub=document.createElement("div");
      sub.className="cartrow";
      sub.style.fontWeight="700";
      sub.innerHTML="<span>إجمالي "+PERSON_LABELS[p]+"</span><span>"+money(pt)+"</span>";
      box.appendChild(sub);
    }
    if(!any) box.innerHTML='<div class="empty">لسه محدش حاطط منتجات</div>';
    return;
  }

  var ids=Object.keys(cart);
  if(!ids.length) {
    box.innerHTML='<div class="empty">لسه ماحطيتيش منتجات</div>';
    return;
  }

  var total=0,qtyTotal=0;
  box.innerHTML="";
  ids.forEach(function(id) {
    var p=PRODUCTS[Number(id)], q=cart[id];
    total += p.price*q;
    qtyTotal += q;
    var row=document.createElement("div");
    row.className="cartrow";
    row.innerHTML="<b>"+p.ar+"</b><span>"+q+" × "+money(p.price)+"</span>";
    box.appendChild(row);
  });

  var totalRow=document.createElement("div");
  totalRow.className="cartrow total";
  totalRow.innerHTML="<span>عدد المنتجات</span><span>"+qtyTotal+"</span>";
  box.appendChild(totalRow);

  var sum=document.createElement("div");
  sum.className="total";
  sum.textContent="الإجمالي قبل الخصم: "+money(total);
  box.appendChild(sum);
}

function renderCartBar() {
  var bar=document.getElementById("cartBar");
  var c=activeCart();
  var ids=Object.keys(c);
  if(!ids.length) { bar.classList.remove("visible"); return; }
  bar.classList.add("visible");

  var total=0,qtyTotal=0;
  ids.forEach(function(id) {
    var p=PRODUCTS[Number(id)], q=c[id];
    total += p.price*q;
    qtyTotal += q;
  });
  document.getElementById("cartBarCount").textContent=
    (mode==="split" ? PERSON_LABELS[currentPerson]+" · " : "")+qtyTotal+" منتج";
  document.getElementById("cartBarTotal").textContent=money(total);
}

document.getElementById("cartBarBtn").onclick=function() {
  var results=document.getElementById("results");
  if(results.innerHTML) results.scrollIntoView({behavior:"smooth",block:"start"});
  else document.querySelector(".card").scrollIntoView({behavior:"smooth"});
};

function allUnits() {
  var a=[];
  Object.keys(cart).forEach(function(id) {
    for(var i=0;i<cart[id];i++) a.push(PRODUCTS[Number(id)].price);
  });
  return a.sort(function(a,b){return b-a;});
}

function buy3Free(a) {
  var free=0;
  for(var i=3;i<a.length;i+=4) free+=a[i];
  return free;
}

function progressive() {
  var a=Object.keys(cart).map(function(id){return PRODUCTS[Number(id)].price;});
  a.sort(function(x,y){return y-x;});
  var d=0;
  for(var i=0;i<a.length && i<8;i++) d+=a[i]*0.08*(i+1);
  return d;
}

function personSubtotals() {
  var arr=new Array(numPeople).fill(0);
  for(var p=0;p<numPeople;p++){
    var c=personCarts[p];
    Object.keys(c).forEach(function(id){
      arr[p]+=PRODUCTS[Number(id)].price*c[id];
    });
  }
  return arr;
}

function groupPriceList() {
  var a=[];
  for(var p=0;p<numPeople;p++){
    var c=personCarts[p];
    Object.keys(c).forEach(function(id){
      for(var i=0;i<c[id];i++) a.push(PRODUCTS[Number(id)].price);
    });
  }
  return a.sort(function(x,y){return y-x;});
}

function groupProgressiveDiscount() {
  var seen={};
  var arr=[];
  for(var p=0;p<numPeople;p++){
    var c=personCarts[p];
    Object.keys(c).forEach(function(id){
      if(!seen[id]){ seen[id]=true; arr.push(PRODUCTS[Number(id)].price); }
    });
  }
  arr.sort(function(x,y){return y-x;});
  var d=0;
  for(var i=0;i<arr.length && i<8;i++) d+=arr[i]*0.08*(i+1);
  return d;
}

function renderResults() {
  var box=document.getElementById("results");

  if(mode==="split"){
    var totalsPerPerson=personSubtotals();
    var groupTotal=totalsPerPerson.reduce(function(a,b){return a+b;},0);
    if(!groupTotal){ box.innerHTML=""; return; }

    var units=groupPriceList();
    var totalFree=buy3Free(units);
    var totalDisc=groupProgressiveDiscount();

    var finalBuy3PerPerson=totalsPerPerson.map(function(t){return t-totalFree*(t/groupTotal);});
    var finalBuy3Total=groupTotal-totalFree;

    var finalProgPerPerson=totalsPerPerson.map(function(t){return t-totalDisc*(t/groupTotal);});
    var finalProgTotal=groupTotal-totalDisc;

    var first=finalBuy3Total<finalProgTotal;
    var equal=finalBuy3Total===finalProgTotal;
    var maxSave=Math.max(totalFree,totalDisc)||1;

    var rows="";
    for(var i=0;i<numPeople;i++){
      rows+='<tr><td style="padding:8px 4px;font-weight:700">'+PERSON_LABELS[i]+'</td>'+
        '<td style="padding:8px 4px;color:var(--muted)">'+money(totalsPerPerson[i])+'</td>'+
        '<td style="padding:8px 4px'+(first&&!equal?';font-weight:800;color:var(--success)':'')+'">'+money(finalBuy3PerPerson[i])+'</td>'+
        '<td style="padding:8px 4px'+(!first&&!equal?';font-weight:800;color:var(--success)':'')+'">'+money(finalProgPerPerson[i])+'</td></tr>';
    }

    box.innerHTML=
      '<div class="offer '+(first&&!equal?"best":"")+'">'+
      (first&&!equal?'<span class="badge">الأوفر للمجموعة</span>':"")+
      '<h3>اشتري ٣ يجي الرابع فري</h3>'+
      '<p class="sub">أرخص منتج في كل ٤ منتجات (من كل الأشخاص مع بعض) بيبقى مجاني.</p>'+
      '<div class="offer-price">'+money(finalBuy3Total)+'</div>'+
      '<div class="save">التوفير: '+money(totalFree)+'</div>'+
      '<div class="savings-bar"><div class="fill" style="width:'+Math.round(totalFree/maxSave*100)+'%"></div></div></div>'+

      '<div class="offer '+(!first&&!equal?"best":"")+'">'+
      (!first&&!equal?'<span class="badge">الأوفر للمجموعة</span>':"")+
      '<h3>الخصم التصاعدي ٨٪</h3>'+
      '<p class="sub">أغلى منتج ٨٪، اللي بعده ١٦٪، وهكذا حتى ٦٤٪ لأول ٨ منتجات مختلفة من كل السلة المشتركة.</p>'+
      '<div class="offer-price">'+money(finalProgTotal)+'</div>'+
      '<div class="save">التوفير: '+money(totalDisc)+'</div>'+
      '<div class="savings-bar"><div class="fill" style="width:'+Math.round(totalDisc/maxSave*100)+'%"></div></div></div>'+

      '<div class="verdict">'+
      (equal ? "العرضين نفس السعر تقريبًا للمجموعة: <b>"+money(finalBuy3Total)+"</b>."
             : "الأوفر للمجموعة هو <b>"+(first?"اشتري ٣ يجي الرابع فري":"الخصم التصاعدي ٨٪")+
               "</b>، والفرق "+money(Math.abs(finalBuy3Total-finalProgTotal))+"." )+
      '</div>'+

      '<div class="card" style="margin-bottom:14px">'+
      '<div class="title">توزيع الدفع بين الأشخاص</div>'+
      '<div style="overflow-x:auto">'+
      '<table style="width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap">'+
      '<tr style="border-bottom:1px solid var(--border)">'+
      '<th style="text-align:right;padding:8px 4px">الشخص</th>'+
      '<th style="text-align:right;padding:8px 4px">قبل الخصم</th>'+
      '<th style="text-align:right;padding:8px 4px">٣+١ فري</th>'+
      '<th style="text-align:right;padding:8px 4px">تصاعدي ٨٪</th></tr>'+
      rows+
      '<tr style="border-top:2px solid var(--border);font-weight:800">'+
      '<td style="padding:8px 4px">الإجمالي</td>'+
      '<td style="padding:8px 4px">'+money(groupTotal)+'</td>'+
      '<td style="padding:8px 4px">'+money(finalBuy3Total)+'</td>'+
      '<td style="padding:8px 4px">'+money(finalProgTotal)+'</td></tr>'+
      '</table></div>'+
      '<small>كل شخص بياخد نفس نسبة الخصم من إجماليه هو (مش سعر منتج معين بالتحديد)، يعني لو الخصم الكلي وفّر مثلاً ١٥٪ من فاتورة المجموعة، كل واحد هيوفر ١٥٪ من فاتورته هو بالظبط — عادل بين الكل بغض النظر مين جاب المنتج الأغلى.</small>'+
      '</div>';
    return;
  }

  var units=allUnits();
  if(!units.length) {box.innerHTML="";return;}

  var total=units.reduce(function(a,b){return a+b;},0);
  var d1=buy3Free(units);
  var f1=total-d1;
  var d2=progressive();
  var f2=total-d2;
  var first=f1<f2;
  var equal=f1===f2;
  var maxSave=Math.max(d1,d2)||1;

  box.innerHTML=
    '<div class="offer '+(first&&!equal?"best":"")+'">'+
    (first&&!equal?'<span class="badge">الأوفر لك</span>':"")+
    '<h3>اشتري ٣ يجي الرابع فري</h3>'+
    '<p class="sub">أرخص منتج في كل ٤ منتجات بيبقى مجاني.</p>'+
    '<div class="offer-price">'+money(f1)+'</div>'+
    '<div class="save">التوفير: '+money(d1)+'</div>'+
    '<div class="savings-bar"><div class="fill" style="width:'+Math.round(d1/maxSave*100)+'%"></div></div></div>'+

    '<div class="offer '+(!first&&!equal?"best":"")+'">'+
    (!first&&!equal?'<span class="badge">الأوفر لك</span>':"")+
    '<h3>الخصم التصاعدي ٨٪</h3>'+
    '<p class="sub">أغلى منتج ٨٪، اللي بعده ١٦٪، وهكذا حتى ٦٤٪ لأول ٨ منتجات مختلفة.</p>'+
    '<div class="offer-price">'+money(f2)+'</div>'+
    '<div class="save">التوفير: '+money(d2)+'</div>'+
    '<div class="savings-bar"><div class="fill" style="width:'+Math.round(d2/maxSave*100)+'%"></div></div></div>'+

    '<div class="verdict">'+
    (equal ? "العرضين نفس السعر تقريبًا: <b>"+money(f1)+"</b>."
           : "الأوفر لك هو <b>"+(first?"اشتري ٣ يجي الرابع فري":"الخصم التصاعدي ٨٪")+
             "</b>، والفرق "+money(Math.abs(f1-f2))+"." )+
    '</div>'+
    '<small>ملاحظة: في الخصم التصاعدي، قطعة واحدة فقط من كل منتج تدخل في ترتيب الخصم؛ القطع الإضافية من نفس المنتج تكون بالسعر الكامل.</small>';
}

document.getElementById("search").oninput=function(e) {
  search=e.target.value;
  renderProducts();
};

document.getElementById("reset").onclick=function() {
  if(mode==="split"){
    personCarts=[{},{},{}];
    renderPeopleControls();
  } else {
    cart={};
  }
  renderProducts();
  renderCart();
  renderResults();
  renderCartBar();
  window.scrollTo({top:0,behavior:"smooth"});
};

renderModeTabs();
renderPeopleControls();
renderTabs();
renderProducts();
renderCart();
renderResults();
renderCartBar();
})();
</script>
</body>
</html>
